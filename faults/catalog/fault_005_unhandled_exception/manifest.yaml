  - "Orders log records ZeroDivisionError: division by zero in calculate_unit_discount()"
expected_fix: "Add guard clause to check if total_items <= 0 before division in calculate_unit_discount()"
expected_fix_type: patch
alternative_fix_type: rollback
risk_tier: T2
rollback_version: v1.0.0
faulty_version: v1.0.5
suggested_patch: |
  --- a/target-app/services/orders/app.py
  +++ b/target-app/services/orders/app.py
  @@ -75,2 +75,4 @@
  -    return total_discount / total_items

fault_id: fault_005_unhandled_exception
title: "Uncaught ZeroDivisionError in bulk order discount calculator"
category: code
difficulty: easy
target_service: orders
target_file: target-app/services/orders/app.py
culprit_change: dep_20261123_v1.0.5
culprit_commit: b5c7d9e1
root_cause: "ZeroDivisionError in calculate_unit_discount when promo_items or total_items is zero"
visible_symptoms:

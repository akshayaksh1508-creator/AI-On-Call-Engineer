global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'orders'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['orders:8081']

  - job_name: 'payments'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payments:8082']

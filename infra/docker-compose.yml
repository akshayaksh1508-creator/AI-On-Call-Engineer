version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nightshift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-target_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-target_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  payments:
    build:
      context: ..
      dockerfile: target-app/Dockerfile
    container_name: nightshift-payments
    restart: unless-stopped
    environment:
      SERVICE_NAME: payments
      SERVICE_PORT: ${PAYMENTS_PORT:-8082}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${PAYMENTS_PORT:-8082}:${PAYMENTS_PORT:-8082}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PAYMENTS_PORT:-8082}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  orders:
    build:
      context: ..
      dockerfile: target-app/Dockerfile
    container_name: nightshift-orders
    restart: unless-stopped
    environment:
      SERVICE_NAME: orders
      SERVICE_PORT: ${ORDERS_PORT:-8081}
      PAYMENTS_SERVICE_URL: http://payments:${PAYMENTS_PORT:-8082}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-target_db}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${ORDERS_PORT:-8081}:${ORDERS_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      payments:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${ORDERS_PORT:-8081}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: target-app/Dockerfile
    container_name: nightshift-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway
      SERVICE_PORT: ${GATEWAY_PORT:-8080}
      ORDERS_SERVICE_URL: http://orders:${ORDERS_PORT:-8081}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    depends_on:
      orders:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${GATEWAY_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: nightshift-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
      - orders
      - payments

volumes:
  postgres_data:

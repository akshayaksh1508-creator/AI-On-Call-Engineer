<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NightShift - Milestone M1 Backup Video Player</title>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    .player-container {
      max-width: 1280px;
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }
    .video-viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .controls {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1c2128;
      border-top: 1px solid #30363d;
    }
    .btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #2ea043; }
    .stage-pill {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: #8b949e;
    }
    .stage-pill.active {
      background: #1f6feb;
      color: #fff;
      border-color: #58a6ff;
    }
    .meta-bar {
      padding: 12px 24px;
      background: #0d1117;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #8b949e;
    }
  </style>
</head>

    let current = 0;
    let playing = true;
    let timer = null;

    function render() {
      document.getElementById('screen').src = frames[current];
      const pills = document.querySelectorAll('.stage-pill');
      pills.forEach((p, idx) => {
        if (idx === current) p.classList.add('active');
        else p.classList.remove('active');
      });
    }

    function nextFrame() {
      current = (current + 1) % frames.length;
      render();
    }

    function togglePlay() {
      playing = !playing;
      document.getElementById('playBtn').innerText = playing ? 'Pause' : 'Play';
      if (playing) {
        timer = setInterval(nextFrame, 2500);
      } else {
        clearInterval(timer);
      }
    }

    function goToStage(idx) {
      current = idx;
      render();
    }

    timer = setInterval(nextFrame, 2500);
  </script>

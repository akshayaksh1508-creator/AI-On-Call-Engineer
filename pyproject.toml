[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "Autonomous AI On-Call Engineer: detects faults, performs root cause analysis, and ships verified fixes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NightShift Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "anthropic>=0.20.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
